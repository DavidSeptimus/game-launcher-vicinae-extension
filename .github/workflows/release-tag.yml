# When a release/vX.Y.Z bump pull request is merged into main, tags vX.Y.Z on the release branch and creates the
# GitHub release with the changelog section as its notes.
#
# The tag goes on the newest commit of the release branch's own line (first parents) that isn't a merge: the head, or
# the commit before it when the head merged main in to resolve conflicts, so main's newer work stays out of the tag.
# That commit is the release as the store published it once changes a store maintainer made in the store pull request
# have been copied into release/vX.Y.Z by hand (docs/development.md); nothing checks that. Tagging is refused if that
# commit doesn't contain the last commit sent to the store (a rebase, or a first-parent line through main) or a merge
# commit sits between the two, since main could then be in the tag; the run summary then has the commands to tag the
# right commit by hand.
#
# Store commits made by store-release.yml carry a "Source-Commit: <sha>" trailer, which scripts/store-state.sh uses to
# find the store pull request that merged this release and the last commit sent to it. If the store hasn't merged the
# release yet, this fails; re-run it once the store has.
name: Tag release

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash  # bash -eo pipefail

env:
  FORK: DavidSeptimus/vicinae-extensions
  UPSTREAM: vicinaehq/extensions
  BRANCH: game-launcher

jobs:
  tag:
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The merge commit, with history (tooling from main; the release branch is reachable through the merge).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Tag the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          tag=${HEAD_REF#release/}
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$HEAD_REF is not a release/vX.Y.Z branch"
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$tag is already released." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          state=$(scripts/store-state.sh . "$tag")
          echo "$state"
          get() { sed -n "s/^$1=//p" <<<"$state"; }
          sent=$(get merged_source) store_pr=$(get merged_pr)
          if [[ -z "$sent" ]]; then
            echo "::error::The store hasn't merged $tag yet: no merged store pull request has a commit from $HEAD_REF. Re-run this workflow once it has (Actions › Tag release › Re-run all jobs)."
            exit 1
          fi
          store_commit=$(gh api "repos/$UPSTREAM/pulls/$store_pr" --jq .merge_commit_sha)

          # A squash or rebase merge leaves the head out of the merge commit's history.
          git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null || git fetch --quiet origin "$HEAD_SHA"
          target=$(git rev-list --first-parent --no-merges -n1 "$HEAD_SHA")

          # Refusing tags nothing; the summary has the commands to tag the right commit by hand, filled in.
          refuse() {
            echo "::error::$1 Nothing was tagged or released; the run summary has the commands to tag it by hand."
            cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## $tag not tagged

          $1

          Nothing was tagged or released. Tag the commit that matches what the store published by hand. That's
          usually ${sent:0:7}, the last commit sent to the store, or a later commit on $HEAD_REF that copied in a
          store maintainer's change. From an up-to-date checkout of main:

          \`\`\`bash
          commit=$sent   # change this if a later commit is the right one
          git fetch origin
          scripts/store-match.sh . "\$commit" $store_commit   # prints "Matches." for the right commit
          git show "\$commit:CHANGELOG.md" > /tmp/CHANGELOG.md
          scripts/changelog-notes.sh /tmp/CHANGELOG.md $tag > /tmp/notes.md
          printf '\nPublished to the Vicinae store in %s (merge commit %s).\n' '$UPSTREAM#$store_pr' '$UPSTREAM@$store_commit' >> /tmp/notes.md
          gh release create $tag --target "\$commit" --title $tag --notes-file /tmp/notes.md
          \`\`\`
          EOF
            exit 1
          }

          # The tag must hold what was sent to the store and nothing from main: the last commit sent is in its history
          # (not so after a rebase, or when the first-parent line runs through main), and no merge commit is in between.
          if ! git merge-base --is-ancestor "$sent" "$target" 2>/dev/null; then
            refuse "${target:0:7}, the commit to tag on $HEAD_REF, doesn't contain ${sent:0:7}, the last commit sent to the store: the branch was rebased or rewritten after the store merged, or main was merged into it with main as the first parent. Tagging it could release main's newer work as $tag."
          fi
          merges=$(git log --merges --format='%h %s' "$sent..$target" | paste -sd ';' | sed 's/;/; /g')
          if [[ -n "$merges" ]]; then
            refuse "$HEAD_REF has a merge commit ($merges) between ${sent:0:7}, the last commit sent to the store, and ${target:0:7}, the commit to tag, so tagging it would release main's newer work as $tag."
          fi
          version=$(git show "$target:package.json" | jq -r .version)
          if [[ "v$version" != "$tag" ]]; then
            refuse "${target:0:7}, the commit to tag on $HEAD_REF, has version $version, not ${tag#v}."
          fi

          git show "$target:CHANGELOG.md" > "$RUNNER_TEMP/CHANGELOG.md"
          {
            scripts/changelog-notes.sh "$RUNNER_TEMP/CHANGELOG.md" "$tag"
            echo
            echo "Published to the Vicinae store in $UPSTREAM#$store_pr (merge commit $UPSTREAM@$store_commit)."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$target" \
            --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
          {
            echo "Tagged $tag at ${target:0:7} and created the GitHub release. The store merged it in https://github.com/$UPSTREAM/pull/$store_pr; the last commit sent from this repo was ${sent:0:7}."
            if [[ "$target" != "$HEAD_SHA" ]]; then
              echo
              echo "The head (${HEAD_SHA:0:7}) merges main in, so the tag goes on the commit before it."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          parents=$(gh api "repos/$GITHUB_REPOSITORY/commits/$MERGE_SHA" --jq '.parents | length')
          if (( parents < 2 )); then
            msg="The bump pull request was squash- or rebase-merged, so the tagged commit isn't part of main's history. Merge bump pull requests with a merge commit."
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
